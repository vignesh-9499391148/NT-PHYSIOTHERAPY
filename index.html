    <!-- Cybersecurity Headers & HTTPS Protocol Enforcement -->
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests; default-src 'self' https: data: blob: 'unsafe-inline' 'unsafe-eval'; img-src 'self' https: data: blob:; font-src 'self' https://fonts.gstatic.com data:; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; frame-src https://www.google.com https://maps.google.com https://www.youtube.com;" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-Frame-Options" content="DENY" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    
    <!-- Active Anti-Clickjacking Framebusting & HTTPS Enforcer -->
    <script>
      try {
        if (window.top !== window.self) {
          window.top.location = window.self.location;
        }
        if (window.location.protocol === 'http:' && !['localhost', '127.0.0.1', '0.0.0.0'].includes(window.location.hostname)) {
          window.location.replace('https:' + window.location.href.substring(window.location.protocol.length));
        }
      } catch (e) {
        console.warn('Security guard initialized:', e);
      }
    </script>
    
    <!-- Google Web Fonts: Plus Jakarta Sans & Inter for Human Clinical Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Clinic 3D Logo Favicon -->
